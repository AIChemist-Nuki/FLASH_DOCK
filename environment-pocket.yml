# ============================================================
# FLASH_DOCK — PocketFormer pocket-detection ISOLATED environment.
#
# This env is intentionally separate from the main app env (`flash_dock`)
# because PocketFormer pins an older/different stack (torch 2.0.1 / PyG 2.5.3
# upstream) that conflicts with the main app's torch + Uni-Core.
# FLASH_DOCK calls it as a subprocess.
#
# Create with:   conda env create -f environment-pocket.yml
# (or `mamba env create -f environment-pocket.yml`)
#
# Notes:
#  - torch is pinned <2.6 so `torch.load` keeps weights_only=False (PocketFormer
#    checkpoints were saved under torch 2.0.1). 2.5.x also ships Apple MPS.
#  - torch / pytorch_scatter / fpocket / scipy / scikit-learn come from
#    conda-forge: on Apple Silicon the pip scipy wheel fails to load (dyld
#    zero-fill error) and pytorch_scatter has no arm64 pip wheel for torch 2.x.
# ============================================================
name: flashdock-pocket
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.4,<2.6
  - pytorch_scatter
  - pytorch_cluster
  - fpocket=4.2
  - numpy=1.26.4
  - scipy
  - scikit-learn
  - pip
  - pip:
      - torch_geometric==2.5.3
      - freesasa==2.2.1
      - omegaconf==2.3.0
      - pandas==2.2.2
      - torchmetrics==1.4.0.post0
      - biopython==1.84
      - torchinfo
      - tqdm
